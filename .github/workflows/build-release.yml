name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glitchdeck-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: 9.0.0
  PLUGINVAL_VERSION: 1.0.4
  CLAP_JUCE_COMMIT: c1a5ad025f95d01e03267857fa8276ebeed16500
  CLAP_VALIDATOR_VERSION: 0.4.1
  CLAP_VALIDATOR_BUILD: 0.4.1-127-g152b982

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache JUCE source
        id: juce-cache
        uses: actions/cache@v5
        with:
          path: .cache/JUCE
          key: juce-${{ runner.os }}-${{ env.JUCE_VERSION }}

      - name: Fetch JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          git clone --depth 1 --branch $env:JUCE_VERSION https://github.com/juce-framework/JUCE.git .cache/JUCE

      - name: Cache CLAP JUCE extensions
        id: clap-juce-cache
        uses: actions/cache@v5
        with:
          path: .cache/clap-juce-extensions
          key: clap-juce-${{ runner.os }}-${{ env.CLAP_JUCE_COMMIT }}

      - name: Fetch CLAP JUCE extensions
        if: steps.clap-juce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/free-audio/clap-juce-extensions.git .cache/clap-juce-extensions
          git -C .cache/clap-juce-extensions checkout $env:CLAP_JUCE_COMMIT
          git -C .cache/clap-juce-extensions submodule update --init --recursive --depth 1

      - name: Configure VST3 and CLAP
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          -DGLITCHDECK_JUCE_PATH="${{ github.workspace }}/.cache/JUCE"
          -DGLITCHDECK_CLAP_JUCE_PATH="${{ github.workspace }}/.cache/clap-juce-extensions"

      - name: Build VST3 and CLAP
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "GlitchDeck.vst3" | Select-Object -First 1
          if (-not $vst) { throw "GlitchDeck.vst3 was not produced" }
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/v$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath .pluginval -Force
          $resultDir = Join-Path $PWD "pluginval-results"
          New-Item -ItemType Directory -Force $resultDir | Out-Null
          $pluginval = Join-Path $PWD ".pluginval/pluginval.exe"
          $arguments = @(
            "--validate-in-process",
            "--strictness-level", "3",
            "--output-dir", ('"' + $resultDir + '"'),
            ('"' + $vst.FullName + '"')
          )
          $process = Start-Process -FilePath $pluginval -ArgumentList $arguments -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "pluginval failed with exit code $($process.ExitCode)" }

      - name: Validate CLAP
        shell: pwsh
        run: |
          $clap = Get-ChildItem -Path build -Recurse -File -Filter "GlitchDeck.clap" | Select-Object -First 1
          if (-not $clap) { throw "GlitchDeck.clap was not produced" }
          $validatorZip = "clap-validator-$env:CLAP_VALIDATOR_BUILD-windows.zip"
          Invoke-WebRequest "https://github.com/free-audio/clap-validator/releases/download/$env:CLAP_VALIDATOR_VERSION/$validatorZip" -OutFile clap-validator.zip
          Expand-Archive clap-validator.zip -DestinationPath .clap-validator -Force
          $validator = Get-ChildItem -Path .clap-validator -Recurse -File -Filter "clap-validator.exe" | Select-Object -First 1
          if (-not $validator) { throw "clap-validator.exe was not found" }
          & $validator.FullName validate $clap.FullName --only-failed
          if ($LASTEXITCODE -ne 0) { throw "clap-validator failed with exit code $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null

          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "GlitchDeck.vst3" | Select-Object -First 1
          if (-not $vst) { throw "GlitchDeck.vst3 was not produced" }
          Compress-Archive -Path $vst.FullName -DestinationPath "$dist/GlitchDeck-Windows-VST3.zip" -Force

          $clap = Get-ChildItem -Path build -Recurse -File -Filter "GlitchDeck.clap" | Select-Object -First 1
          if (-not $clap) { throw "GlitchDeck.clap was not produced" }
          Copy-Item $clap.FullName "$dist/GlitchDeck.clap" -Force
          Compress-Archive -Path "$dist/GlitchDeck.clap" -DestinationPath "$dist/GlitchDeck-Windows-CLAP.zip" -Force

          Copy-Item docs/TESTING.md "$dist/TESTING.md"
          Copy-Item docs/MIDI_SETUP.md "$dist/MIDI_SETUP.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: GlitchDeck-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GlitchDeck-pluginval
          path: pluginval-results/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish v1 alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1-alpha-${{ github.run_number }}"
          gh release create $tag dist/* --prerelease --target "${{ github.sha }}" --title "GlitchDeck v1 alpha ${{ github.run_number }}" --notes "Automated Windows CLAP + VST3 build from ${{ github.sha }}. CLAP is the preferred Bitwig format for direct MIDI CC pad learn. VST3 passes pluginval strictness 3 and CLAP passes clap-validator before publication. See TESTING.md and MIDI_SETUP.md."
