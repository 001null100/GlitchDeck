name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glitchdeck-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAP_VALIDATOR_VERSION: 0.4.1
  CLAP_VALIDATOR_BUILD: 0.4.1-127-g152b982

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native CLAP
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build GlitchDeck
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Validate CLAP
        shell: pwsh
        run: |
          $clap = Get-ChildItem -Path build -Recurse -File -Filter "GlitchDeck.clap" | Select-Object -First 1
          if (-not $clap) { throw "GlitchDeck.clap was not produced" }
          $validatorZip = "clap-validator-$env:CLAP_VALIDATOR_BUILD-windows.zip"
          Invoke-WebRequest "https://github.com/free-audio/clap-validator/releases/download/$env:CLAP_VALIDATOR_VERSION/$validatorZip" -OutFile clap-validator.zip
          Expand-Archive clap-validator.zip -DestinationPath .clap-validator -Force
          $validator = Get-ChildItem -Path .clap-validator -Recurse -File -Filter "clap-validator.exe" | Select-Object -First 1
          if (-not $validator) { throw "clap-validator.exe was not found" }
          & $validator.FullName validate $clap.FullName --only-failed
          if ($LASTEXITCODE -ne 0) { throw "clap-validator failed with exit code $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $clap = Get-ChildItem -Path build -Recurse -File -Filter "GlitchDeck.clap" | Select-Object -First 1
          if (-not $clap) { throw "GlitchDeck.clap was not produced" }
          Copy-Item $clap.FullName "$dist/GlitchDeck.clap" -Force
          Compress-Archive -Path "$dist/GlitchDeck.clap" -DestinationPath "$dist/GlitchDeck-Windows-CLAP.zip" -Force
          Copy-Item docs/TESTING.md "$dist/TESTING.md"
          Copy-Item docs/MIDI_SETUP.md "$dist/MIDI_SETUP.md"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: GlitchDeck-Windows-CLAP
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish v1 alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1-alpha-${{ github.run_number }}"
          gh release create $tag dist/* --prerelease --target "${{ github.sha }}" --title "GlitchDeck v1 alpha ${{ github.run_number }}" --notes "Native null-clap Windows build from ${{ github.sha }}. The CLAP module passes clap-validator before publication. Raw MIDI CC pad input is handled directly through the CLAP note port. See TESTING.md and MIDI_SETUP.md."
